<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>카드뉴스 메이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* VOICE: 편집국 데스크의 작업 도구. 단정하고 빠르게
   IDEA: 조판대. 왼쪽은 원고, 오른쪽은 막 찍혀 나온 교정쇄
   PICTURE: 실제 카드 미리보기 캐러셀 자체
   COLOUR and TYPE: 흰 바탕, 먹색, 신문 빨강 하나 / Noto Sans KR
   LAYOUT: 먹색 제목줄, 원고 | 교정쇄 2단, 아래에 캡션과 장별 편집 */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#121212);--ink:light-dark(#141414,#ececec);--sub:light-dark(#5a5a5a,#a9a9a9);--line:light-dark(#dedede,#303030);--panel:light-dark(#f4f4f2,#1b1b1b);--red:#e52320}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;overflow-x:clip}
.top{background:#141414;color:#fff;padding:22px max(5vw,16px);display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;border-bottom:4px solid var(--red)}
.top h1{margin:0;font-size:32px;line-height:1.05;font-weight:900}
.top p{margin:0;color:#bdbdbd;font-size:15px}
.wrap{max-width:1240px;margin:0 auto;padding:28px max(4vw,16px);display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);grid-template-areas:"desk stage";gap:36px}
.desk{grid-area:desk}.stage{grid-area:stage}
h2{font-size:20px;margin:0 0 12px;font-weight:700}
label{display:block;font-size:14px;font-weight:700;margin:16px 0 6px}
input,textarea,select{font:16px/1.5 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{resize:vertical}
input[type=color]{padding:4px;height:44px}
input[type=file]{padding:8px}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
button{font:700 15px/1 "Noto Sans KR","Apple SD Gothic Neo",sans-serif;min-height:44px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--ink)}
button.primary{background:var(--red);border-color:var(--red);color:#fff;width:100%;min-height:52px;font-size:17px}
button.primary:disabled{opacity:.6;cursor:wait}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;border:0;padding:0;margin:0}
.seg legend{font-size:14px;font-weight:700;margin-bottom:6px}
.seg label{margin:0;font-weight:500;border:1px solid var(--line);border-radius:8px;min-height:44px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px}
.seg input{position:absolute;opacity:0;width:1px}
.seg input:checked+span{font-weight:900}
.seg label:has(input:checked){background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--red);outline-offset:2px}
.row{display:grid;grid-template-columns:minmax(0,110px) minmax(0,1fr);gap:12px}
.note{font-size:13px;color:var(--sub);margin:8px 0 0}
#msg{min-height:24px;font-size:14px;margin:10px 0 0}
#msg.err{color:var(--red)}
details{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:700;min-height:32px}
.stagehead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav{display:flex;gap:6px}.nav button{width:44px;padding:0}
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 14px;outline-offset:4px}
.rail figure{flex:0 0 min(80%,380px);margin:0;scroll-snap-align:start}
.rail img{display:block;width:100%;aspect-ratio:4/5;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.12),0 10px 28px rgba(0,0,0,.16);background:var(--panel)}
.rail figcaption{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--sub);margin-top:8px}
.rail figcaption button{min-height:36px;font-size:13px;padding:0 12px}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.acts .primary{width:auto;padding:0 22px}
.lower{background:var(--panel);border-top:1px solid var(--line)}
.lower .in{max-width:1240px;margin:0 auto;padding:28px max(4vw,16px);display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:36px}
#cap{min-height:260px}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:8px 0 0}
.chips li{font-size:13px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 10px}
#eds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ed{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.edh{display:flex;gap:6px;align-items:center}
.edh b{font-size:15px;margin-right:auto}
.edh select{width:auto;padding:6px 8px;min-height:36px}
.edh button{min-height:36px;width:36px;padding:0;font-size:14px}
.ed label{margin:10px 0 4px;font-size:13px}
.ed textarea,.ed input{font-size:16px;padding:8px 10px}
#add{margin-top:14px}
@media(max-width:900px){.wrap,.lower .in{grid-template-columns:minmax(0,1fr)}.wrap{grid-template-areas:"stage" "desk"}}
@media(prefers-reduced-motion:no-preference){.rail img{transition:opacity .25s}.busy .rail img{opacity:.45}}
</style>
</head>
<body>
<header class="top">
  <h1>카드뉴스 메이커</h1>
  <p>기사를 붙여 넣으면 인스타그램 카드뉴스 이미지(1080×1350)와 게시 캡션을 만듭니다</p>
</header>

<main class="wrap">
  <section class="stage" aria-label="미리보기">
    <div class="stagehead">
      <h2>미리보기</h2>
      <div class="nav"><button id="prev" aria-label="이전 장">←</button><button id="next" aria-label="다음 장">→</button></div>
    </div>
    <div id="rail" class="rail" tabindex="0" aria-label="카드 목록"></div>
    <div class="acts">
      <button id="zip" class="primary" hidden>전체 이미지 저장 (ZIP)</button>
      <span id="dlhint" class="note">이미지를 길게 누르거나 우클릭해서 저장할 수 있습니다.</span>
    </div>
    <p class="note" id="sampleNote">지금 보이는 카드는 기사 「러시아가 수출한 화석연료서 CO₂ 694억t」로 만든 예시입니다.</p>
  </section>

  <section class="desk" aria-label="기사 입력">
    <fieldset class="seg" id="series">
      <legend>시리즈</legend>
      <label><input type="radio" name="series" value="climate" checked><span>기후의 역습</span></label>
      <label><input type="radio" name="series" value="open"><span>증시 레이더 · 개장</span></label>
      <label><input type="radio" name="series" value="close"><span>증시 레이더 · 마감</span></label>
      <label><input type="radio" name="series" value="general"><span>일반 기사</span></label>
    </fieldset>
    <label for="title">기사 제목</label>
    <input id="title" autocomplete="off">
    <label for="body">기사 본문</label>
    <textarea id="body" rows="11" placeholder="기사 본문을 그대로 붙여 넣으세요"></textarea>
    <div class="row">
      <div><label for="count">장수</label>
        <select id="count"><option selected>5</option><option>6</option><option>7</option><option>8</option></select></div>
      <div><label for="ep">회차 (선택)</label><input id="ep" inputmode="numeric" placeholder="예: 251"></div>
    </div>
    <label for="src">출처 (카드 하단)</label><input id="src" placeholder="예: 카본브리프·CICERO 분석">
    <label for="photo">표지 하단 사진 (선택, 없으면 그림)</label><input id="photo" type="file" accept="image/*">
    <p class="note" id="photoNote" hidden>표지 사진 적용됨 · <button id="rmPhoto" style="min-height:32px;font-size:13px">사진 빼기</button></p>
    <div style="margin-top:18px"><button id="gen" class="primary">카드뉴스 생성</button></div>
    <p id="msg" role="status" aria-live="polite"></p>
    <details>
      <summary>매체 설정</summary>
      <label for="bname">매체 이름</label><input id="bname">
      <label for="bhandle">인스타그램 계정</label><input id="bhandle" placeholder="@계정 (비우면 로고만 표시)">
      <label for="bcolor">강조색</label><input id="bcolor" type="color">
      <label style="display:flex;gap:8px;align-items:center;font-weight:500"><input id="blogo" type="checkbox" style="width:20px;height:20px"> 카드 하단에 로고 이미지 사용</label>
      <p class="note">설정은 이 브라우저에 저장됩니다.</p>
    </details>
  </section>
</main>

<section class="lower">
  <div class="in">
    <div>
      <h2>인스타그램 캡션</h2>
      <textarea id="cap" aria-label="캡션"></textarea>
      <div class="acts"><button id="copy">캡션 복사</button></div>
      <h2 style="margin-top:22px;font-size:16px">게시 전 원문과 대조할 것</h2>
      <ul id="verify" class="chips"></ul>
    </div>
    <div>
      <h2>장별 편집</h2>
      <div id="eds"></div>
      <button id="add">+ 장 추가</button>
    </div>
  </div>
</section>

],caption:'수출한 화석연료, 탄소는 누구의 몫일까요?\n\n1850~2025년 수출된 화석연료를 태울 때 발생한 CO₂를 집계했더니, 러시아가 694억t으로 가장 많았습니다. 사우디아라비아는 610억t, 호주는 281억t으로 뒤를 이었습니다.\n\n이번 분석은 연료를 ‘태운 나라’ 대신 ‘채굴해 수출한 나라’를 기준으로 계산했습니다. 일본에서 사용한 호주산 석탄의 배출량을 호주에 배분하는 방식입니다.\n\n그렇다고 수출국에 모든 책임이 있다는 뜻은 아닙니다. 생산국과 기업, 소비국 사이에서 기후피해 비용을 어떻게 나눌지 살펴보는 또 하나의 기준입니다.\n\n여러분은 화석연료의 탄소 배출 책임을 어떻게 나눠야 한다고 생각하시나요?\n\n출처: 카본브리프·CICERO 분석',

$('#body').value="1850~2025년 화석연료 수출 분석…연소한 국가 대신 채굴국 기준으로 배출량 계산\n호주, 누적 수출 배출량 3위…COP31 화석연료 퇴출·기후재정 논쟁과 맞물려\n\n러시아가 1850년부터 2025년까지 수출한 석탄·석유·가스를 태우는 과정에서 발생한 이산화탄소(CO₂)가 약 694억t에 달한다는 분석이 나왔다. 사우디아라비아는 610억t, 호주는 281억t으로 뒤를 이었다. 화석연료를 소비한 나라가 아니라 캐내 수출한 나라를 기준으로 배출량을 집계한 결과다.\n\n영국 기후전문매체 카본브리프는 17일(현지시간) 노르웨이 기후연구기관 CICERO의 로비 앤드루 수석연구원이 구축한 자료를 토대로 국가별 화석연료 생산·수출량을 분석해 이같이 밝혔다. 베네수엘라와 이란도 주요 수출국으로 꼽혔으며, 노르웨이와 아랍에미리트(UAE), 캐나다가 공급한 화석연료에서도 상당한 양의 CO₂가 발생한 것으로 나타났다.\n\n이번 분석은 튀르키예 안탈리아에서 열리는 유엔기후변화협약 당사국총회(COP31)의 화석연료 퇴출 논의와 맞물려 관심을 끈다. 특히 튀르키예와 함께 공동의장국을 맡은 호주가 누적 수출 배출량 3위에 오르면서, 화석연료 수출국이 기후피해 비용을 얼마나 부담해야 하는지도 쟁점이 됐다.\n\n채굴국 기준으로 바꾸자 일본 6위→34위\n\n통상 국가별 온실가스 배출량은 연료가 실제로 사용된 곳을 기준으로 계산한다. 한국에서 수입 원유를 태우면 한국의 배출량으로, 일본 발전소에서 호주산 석탄을 태우면 일본의 배출량으로 잡힌다.\n\n카본브리프는 화석연료를 채굴한 나라에 배출량을 배분했다. 호주산 석탄이 일본에서 소비됐더라도 그 연소로 발생한 CO₂를 호주에 귀속하는 방식이다. 과거 자료는 현재 국경을 기준으로 정리했다. 옛 소련과 체코슬로바키아, 유고슬라비아의 자료는 국가 분리 당시 비중을 토대로 현 국가들에 나눴다.\n\n기준을 바꾸자 국가별 누적 배출량 순위도 달라졌다. 사우디아라비아의 역사적 온난화 기여도는 수출한 화석연료를 반영할 경우 기존보다 네 배 이상 커졌다. 호주에 귀속되는 누적 배출량도 두 배 이상 늘어 세계 10위 안에 들었다.\n\n에너지 수입 의존도가 높은 독일·프랑스·일본은 반대였다. 특히 영토 내 누적 CO₂ 배출량이 세계 6위인 일본은 채굴 기준으로 34위까지 내려갔다.\n\n미국과 중국은 채굴 기준으로도 각각 1·2위를 유지했다. 두 나라 모두 오랫동안 화석연료를 순수입했지만, 자국에서 생산하고 소비한 석탄·석유·가스 규모도 컸기 때문이다. 러시아는 그 뒤를 이었다. 수출한 화석연료의 배출량 순위와 국내 소비분까지 포함한 채굴 기준 순위가 다른 이유다.\n\n화석연료 퇴출 제안한 호주도 수출 3위\n\n호주는 COP31에서 화석연료 사용을 줄이기 위한 협상을 중재하고 있다. 지난 16일 공개한 합의문 초안에는 에너지 체계에서 화석연료로부터의 전환에 즉각 나서고, 단계적 퇴출을 위한 행동을 서두르는 내용이 담겼다.\n\n그러나 사우디아라비아와 러시아 등 일부 산유국과 아랍권 국가들이 퇴출 문구에 반대하고 있어 최종 합의문에 반영될지는 불투명하다. 144개 항목으로 이뤄진 초안의 상당 부분에도 각국의 반대와 수정 요구가 제기된 상태다.\n\n기후단체들은 협상을 주도하는 국가의 화석연료 수출 이력도 따져야 한다고 주장한다. ‘오염자 부담을 위한 국제연합’은 화석연료를 팔아 이익을 얻은 국가와 기업이 기후피해 비용을 더 많이 부담해야 한다는 입장이다. 소비국에 배출량을 귀속하는 기존 통계만으로는 수출로 얻은 이익과 그에 따른 책임을 충분히 반영하기 어렵다는 것이다.\n\n호주가 제시한 화석연료 퇴출 방안과 자국 수출산업을 어떻게 조정할지도 관심사다. 협상에서 다른 나라의 감축을 요구하는 동시에 자국이 공급하는 석탄과 가스를 줄일 방안도 설명해야 한다는 압박을 받게 됐다.\n\n생산국·기업·소비국의 책임은 어떻게 나누나\n\n채굴 기준 집계가 생산국에 모든 책임을 돌려야 한다는 뜻은 아니다. 자료를 구축한 앤드루 연구원도 카본브리프에 화석연료 연소의 책임을 채굴국에만 물을 수는 없다며 생산국과 기업, 소비국이 함께 책임져야 한다고 밝혔다. 중동 석유산업의 상당 부분이 서방 자본과 수요를 바탕으로 개발됐다는 역사도 고려해야 한다는 설명이다.\n\n사우디아라비아는 소비국의 선택을 강조한다. 연료를 어떻게 사용하고 어떤 기술로 배출량을 줄일지는 최종 소비국이 결정하는 만큼, 소비한 나라의 책임을 제외한 채 수출국에만 부담을 지우는 것은 부당하다는 주장이다.\n\n배출량을 계산하는 기준에 따라 국가별 책임은 달라진다. 영토 기준은 국내에서 발생한 배출량을, 소비 기준은 수입품을 포함해 자국이 소비한 상품과 서비스에 수반된 배출량을 따진다. 인구 규모를 고려하려면 1인당 누적 배출량을 비교할 수도 있다. 채굴 기준은 여기에 연료 공급국의 몫을 추가로 살펴보는 방법이다.\n\n이번 분석은 기존 배출량 통계를 대체하거나 국가별 분담금을 정한 결과가 아니다. 다만 화석연료 수출로 이익을 얻은 국가에도 기후재정 기여를 요구하는 근거로 쓰일 수 있다. COP31에서 감축과 재정 지원의 분담을 논의하는 각국이 자국 내 배출량뿐 아니라 국경 밖으로 내보낸 연료의 배출량까지 설명해야 할 이유가 생겼다.";

const F=(w,s)=>`${w} ${s}px "Noto Sans KR","Apple SD Gothic Neo",sans-serif`;
const INK='#fbf7ef',SUB='#c3ccd9',MW=W-2*PAD,UP='#ff5a5f',DOWN='#4d9bff';
function mix(a,b,t){const p=v=>[1,3,5].map(k=>parseInt(v.slice(k,k+2),16));const A=p(a),B=p(b);return'#'+A.map((v,k)=>Math.round(v+(B[k]-v)*t).toString(16).padStart(2,'0')).join('')}
function theme(){
  const s=st.series,acc=s==='climate'?'#f7862b':(s==='open'||s==='close')?'#e52320':(/^#[0-9a-f]{6}$/i.test(brand.color)?brand.color:'#e52320');
  return{acc,bars:[acc,mix(acc,'#ffffff',.28),'#5b8fc7','#7f97b5','#8a96a8']};
}
function wrap(x,text,maxW){
  const out=[];
  for(const para of String(text||'').split('\n')){
    let line='';
    for(const w of para.split(/(\s+)/)){
      if(!w)continue;
      if(x.measureText(line+w).width<=maxW){line+=w;continue}
      if(line.trim()){out.push(line.trimEnd());line=''}
      const ww=w.trimStart();
      if(x.measureText(ww).width<=maxW){line=ww;continue}
      for(const ch of ww){if(x.measureText(line+ch).width>maxW&&line){out.push(line);line=''}line+=ch}
    }
    out.push(line.trimEnd());
  }
  return out;
}
function fit(x,text,maxW,maxH,size,min,w,lh){
  for(let s=size;s>=min;s-=2){x.font=F(w,s);const L=wrap(x,text,maxW);if(L.length*s*lh<=maxH)return{L,s,lh,w}}
  x.font=F(w,min);return{L:wrap(x,text,maxW),s:min,lh,w};
}
function put(x,r,X,y,color){x.font=F(r.w,r.s);x.fillStyle=color;r.L.forEach((l,i)=>x.fillText(l,X,y+i*r.s*r.lh));return y+r.L.length*r.s*r.lh}
const hgt=r=>r.L.length*r.s*r.lh;
function clip1(x,s,maxW){s=String(s||'');if(x.measureText(s).width<=maxW)return s;while(s&&x.measureText(s+'…').width>maxW)s=s.slice(0,-1);return s+'…'}
function dirOf(c){c=String(c||'').trim();return /^[+▲]|상승|올라/.test(c)?'up':/^[-−▼]|하락|내려/.test(c)?'down':'flat'}
// *별표*로 감싼 부분은 붓터치 밑줄
function marks(t){let plain='',o=null;const R=[];for(const ch of String(t||'')){if(ch==='*'){if(o===null)o=plain.length;else{R.push([o,plain.length]);o=null}}else plain+=ch}return{plain,R}}
function brush(x,X,y,w,t,col){
  x.save();x.strokeStyle=col;x.lineCap='round';x.lineWidth=t;
  x.beginPath();x.moveTo(X,y+t*.35);x.bezierCurveTo(X+w*.3,y-t*.35,X+w*.68,y+t*.45,X+w,y-t*.25);x.stroke();
  x.globalAlpha=.65;x.lineWidth=t*.45;x.beginPath();x.moveTo(X+w*.1,y+t*.8);x.quadraticCurveTo(X+w*.5,y+t*.25,X+w*.97,y+t*.5);x.stroke();x.restore();
}
function putH(x,r,X,y,color,M,acc,center){
  x.font=F(r.w,r.s);let ptr=0;
  r.L.forEach((l,i)=>{
    const yy=y+i*r.s*r.lh;let idx=M.plain.indexOf(l,ptr);if(idx<0)idx=ptr;ptr=idx+l.length;
    const x0=center?X-x.measureText(l).width/2:X;
    for(const [a,b] of M.R){const s=Math.max(a,idx),e=Math.min(b,idx+l.length);if(s>=e)continue;
      const px=x0+x.measureText(l.slice(0,s-idx)).width,pw=x.measureText(l.slice(s-idx,e-idx)).width;brush(x,px-6,yy+r.s*1.1,pw+12,r.s*.1,acc)}
    x.fillStyle=color;x.fillText(l,x0,yy);
  });
  return y+r.L.length*r.s*r.lh;
}
function kicker(x,txt,acc){
  x.font=F(900,38);const w=x.measureText(txt).width+52,X=PAD-6,Y=56,hh=72,sk=20;
  x.beginPath();x.moveTo(X,Y);x.lineTo(X+w+sk,Y);x.lineTo(X+w,Y+hh);x.lineTo(X,Y+hh);x.closePath();x.fillStyle=acc;x.fill();
  x.fillStyle='#1b1208';x.fillText(txt,X+24,Y+13);
}
function bars(x,items,y,t,rowH){
  const its=items.filter(o=>o.name||o.value);if(!its.length)return y;
  const nums=its.map(o=>parseFloat(String(o.value).replace(/,/g,'').replace(/[^\d.]/g,''))||0),max=Math.max(...nums,1);
  x.font=F(700,38);const nameW=Math.min(300,Math.max(...its.map(o=>x.measureText(o.name).width)));
  x.font=F(900,48);const valW=Math.max(...its.map(o=>x.measureText(o.value).width));
  const nx=PAD+118,bx=nx+nameW+28,maxW=Math.max(120,W-PAD-bx-valW-18);
  x.textBaseline='middle';
  its.forEach((o,k)=>{
    const cy=y+k*rowH+rowH/2,bh=rowH*.66,bw=Math.max(10,maxW*nums[k]/max);
    x.font=F(900,54);x.fillStyle=t.acc;x.fillText(String(k+1).padStart(2,'0'),PAD,cy+3);
    x.fillStyle='rgba(255,255,255,.5)';x.fillRect(PAD+90,cy-28,2,56);
    x.font=F(700,38);x.fillStyle=INK;x.fillText(clip1(x,o.name,nameW),nx,cy+2);
    x.fillStyle=t.bars[Math.min(k,t.bars.length-1)];x.fillRect(bx,cy-bh/2,bw,bh);
    x.font=F(900,48);x.fillStyle=INK;x.fillText(o.value,bx+bw+16,cy+3);
  });
  x.textBaseline='top';return y+its.length*rowH;
}
function indexRows(x,items,y){
  const its=items.filter(o=>o.name||o.value);if(!its.length)return y;const rh=Math.min(180,(1010-y)/its.length);
  its.forEach((o,k)=>{
    const yy=y+k*rh;x.fillStyle='rgba(255,255,255,.16)';x.fillRect(PAD,yy,MW,2);
    x.font=F(500,34);x.fillStyle=SUB;x.fillText(o.name,PAD,yy+20);
    x.font=F(900,Math.round(Math.min(80,rh*.45)));x.fillStyle=INK;x.fillText(o.value,PAD,yy+62);
    const d=dirOf(o.change||o.pct),col=d==='up'?UP:d==='down'?DOWN:SUB,ar=d==='up'?'▲ ':d==='down'?'▼ ':'';
    x.textAlign='right';x.fillStyle=col;
    if(o.change){x.font=F(700,42);x.fillText(ar+String(o.change).replace(/^[+\-−▲▼]\s*/,''),W-PAD,yy+28)}
    if(o.pct){x.font=F(700,38);x.fillText(String(o.pct),W-PAD,yy+28+(o.change?58:0))}
    x.textAlign='left';
  });
  return y+its.length*rh+10;
}
function keyLine(x,txt,y,acc){
  const r=fit(x,txt,MW-40,130,46,30,900,1.3);x.fillStyle=acc;x.fillRect(PAD,y+r.s*.12,12,hgt(r)-r.s*.36);
  return put(x,r,PAD+40,y,INK);
}
function spark(x,dir,col,top,bot){
  let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const N=42,pts=[];let v=dir==='down'?.8:dir==='up'?.2:.5;
  for(let k=0;k<N;k++){v+=(rnd()-.5)*.13+(dir==='down'?-.014:dir==='up'?.014:0);v=Math.min(.95,Math.max(.05,v));pts.push([PAD+k*MW/(N-1),bot-v*(bot-top)])}
  const g=x.createLinearGradient(0,top,0,bot);g.addColorStop(0,col+'66');g.addColorStop(1,col+'00');
  x.beginPath();x.moveTo(pts[0][0],bot);pts.forEach(p=>x.lineTo(p[0],p[1]));x.lineTo(pts[N-1][0],bot);x.closePath();x.fillStyle=g;x.fill();
  x.beginPath();pts.forEach((p,k)=>k?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.strokeStyle=col;x.lineWidth=8;x.lineJoin='round';x.stroke();
  const e=pts[N-1];x.beginPath();x.arc(e[0],e[1],14,0,7);x.fillStyle=col;x.fill();
}

    const g=x.createLinearGradient(0,top,0,top+hh*.4);g.addColorStop(0,'#0b1527');g.addColorStop(1,'rgba(11,21,39,0)');x.fillStyle=g;x.fillRect(0,top,W,hh*.4+1);
  }else if(st.series==='climate'){
    let seed=5;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
    const base=H-70;
    const hz=x.createRadialGradient(W/2,base-60,10,W/2,base-60,W*.8);hz.addColorStop(0,'rgba(247,134,43,.42)');hz.addColorStop(1,'rgba(247,134,43,0)');x.fillStyle=hz;x.fillRect(0,top,W,hh);
    const R=Math.max(420,Math.min(620,hh*1.3)),cx=W*.47,cy=top+40+R;
    x.save();x.shadowColor='rgba(120,170,255,.6)';x.shadowBlur=46;x.beginPath();x.arc(cx,cy,R,0,7);

const GUIDE={
 climate:'시리즈 "기후의 역습"(포커스온경제 기후 연재). 구성: cover(핵심을 묻거나 선언하는 제목, 순위·크기 비교 수치가 있으면 items로 상위 3~5개 막대그래프, key로 집계 기준이나 핵심 한 줄) → 기준·원인·영향을 하나씩 point(비교할 숫자 쌍이 있으면 index) → 전문가 발언 원문이 기사에 있으면 quote → 책임·대응(point) → outro(독자에게 묻는 질문). 경각심은 주되 과장하지 말 것.',

function prompt(title,article,count){
  return `너는 경제 전문 매체 포커스온경제의 SNS 편집자다. 아래 기사로 인스타그램 카드뉴스 ${count}장(표지·마무리 포함)과 게시물 캡션을 만든다.

${GUIDE[st.series]}

규칙:
- 기사에 없는 사실·수치는 절대 만들지 않는다. 수치·인명·기관명·단위는 원문 표기 그대로 쓴다.
- 모든 title에서 가장 중요한 어구 하나를 *별표*로 감싼다 (붓터치 밑줄로 강조됨). 예: "탄소는 *누구의 몫일까*"
- cover.title: 두 줄(\\n), 줄당 11자 이내. cover.body: 기간·대상을 밝히는 부제 30자 이내. cover.items: 순위·크기 비교가 있으면 [{"name":"러시아","value":"694억t"}] 형식 상위 3~5개(큰 순서), 없으면 []. cover.key: 핵심 한 줄 24자 이내. cover.note: 그래프 집계 기준 주석 20자 이내(선택). cover.dir: 증시면 "up"|"down"|"flat", 아니면 "".
- bars: title 18자 이내, body 부제, items 위와 같은 형식, key 선택.
- index: title 짧게(예: "오늘의 지수"). items: [{"name":"코스피","value":"2,812.45","change":"+18.32","pct":"+0.66%"}] 형식, change·pct에는 +/- 부호. 순위 변화 같은 비교는 {"name":"일본 (영토→채굴 기준)","value":"6위 → 34위"}처럼. 없는 값은 "".
- point: title 두 줄 이내 18자 이내. body 90자 이내, 1~3문장, 쉬운 말과 "~습니다"체. key: 그 장의 결론 한 줄 24자 이내.
- quote: title은 기사에 따옴표로 나온 발언 원문만(60자 이내), body는 "이름 직함". 원문 발언이 없으면 quote를 쓰지 않는다.
- outro: title은 독자에게 묻는 질문 두 줄, body는 "여러분의 생각을 댓글로 남겨 주세요" 같은 한 줄.
- kicker는 모두 "".
- source: 카드 하단에 쓸 원 출처(기사가 인용한 기관·매체·연구, 20자 이내). 없으면 "포커스온경제".
- caption: 아래 구성으로, 문단 사이는 빈 줄(\\n\\n). "~습니다"체, 이모지 없음.
  1) 첫 줄: 독자에게 묻는 질문형 제목 한 줄 (25자 이내)
  2) 핵심 사실과 수치 1문단 (2~3문장)
  3) 기준·맥락·배경 설명 1문단 (2문장)
  4) 과장하지 않도록 균형을 잡는 단서 1문단 ("그렇다고 ~는 아닙니다" 식, 2문장)
  5) 독자 참여를 부르는 질문 한 문장 ("여러분은 ~ 생각하시나요?")
  6) "출처: " + source
- hashtags: 5개 안팎, 각각 #으로 시작, 마지막은 시리즈 태그(#기후의역습, #증시레이더 등, 일반 기사면 생략).
- verify: 카드와 캡션에 쓴 수치·고유명사 가운데 게시 전 원문과 대조해야 할 항목(각 20자 이내).

JSON 객체 하나만 출력한다. 형식:

기사 제목: ${title}
기사 본문:
${article}`;

    dir:['up','down','flat'].includes(o.dir)?o.dir:'',items:Array.isArray(o.items)?o.items.map(it=>({name:str(it&&it.name),value:str(it&&it.value),change:str(it&&it.change),pct:str(it&&it.pct)})):[]}));
  if(!sl.length)throw{message:'카드 내용을 받지 못했습니다'};
  st.slides=sl;st.caption=str(v.caption);st.source=str(v.source);$('#src').value=st.source;
  st.tags=(Array.isArray(v.hashtags)?v.hashtags:[]).map(t=>{t=str(t).trim();return t.startsWith('#')?t:'#'+t}).filter(t=>t.length>1);
  st.verify=(Array.isArray(v.verify)?v.verify:[]).map(str).filter(Boolean);
}

  if(article.length<80){msg('기사 본문을 붙여 넣어 주세요 (80자 이상).',true);return}
  const sample=await use('sample');
  if(!sample){msg('AI 생성은 claude.ai에서 이 페이지를 열었을 때만 동작합니다. 카드는 아래 편집 칸에서 직접 고칠 수 있습니다.',true);return}
  busy=true;const b=$('#gen');b.disabled=true;b.textContent='생성 중… (20~40초)';document.body.classList.add('busy');msg('기사를 읽고 카드 문안을 쓰는 중입니다.');
  try{
    const p=prompt(title,article,$('#count').value);
    const v=typeof sample.json==='function'?await sample.json(p,{modelTier:'default'}):(await sample(p,{modelTier:'default'})).text;
    norm(v);$('#sampleNote').hidden=true;editors();lowerPanel();await render();
    msg('완성했습니다. 문구를 확인하고, 필요하면 아래에서 고친 뒤 저장하세요.');
    $('#rail').scrollTo({left:0});
  }catch(e){
    const c=e&&e.code;
    msg(c==='not_granted'?'AI 사용 권한이 허용되지 않았습니다.':c==='rate_limited'?'요청이 많습니다. 잠시 후 다시 눌러 주세요.':'생성에 실패했습니다: '+((e&&e.message)||'알 수 없는 오류'),true);
  }finally{busy=false;b.disabled=false;b.textContent='카드뉴스 생성';document.body.classList.remove('busy')}
};

/* ---------- 저장·복사 ---------- */
const fname=i=>`${TODAY.replace(/\./g,'')}_${kickerOf().replace(/[^\w가-힣]+/g,'')}_${String(i+1).padStart(2,'0')}.jpg`;
const blobOf=c=>new Promise(r=>c.toBlob(r,'image/jpeg',.92));
async function saveOut(filename,data){
  try{await dl.save({filename,data});msg(`${filename} 저장했습니다.`)}
  catch(e){msg(e&&e.code==='declined'?'저장을 취소했습니다.':'저장할 수 없습니다. 이미지를 길게 누르거나 우클릭해 저장해 주세요.',e&&e.code!=='declined')}
}
async function saveOne(i){await saveOut(fname(i),await blobOf(st.canvases[i]))}
$('#zip').onclick=async()=>{
  if(!window.JSZip){msg('ZIP 도구를 불러오지 못했습니다. 장별 저장을 이용해 주세요.',true);return}
  const z=new JSZip();for(let i=0;i<st.canvases.length;i++)z.file(fname(i),await blobOf(st.canvases[i]));
  await saveOut(`카드뉴스_${TODAY.replace(/\./g,'')}.zip`,await z.generateAsync({type:'blob'}));
};
$('#copy').onclick=()=>{const t=$('#cap').value;
  navigator.clipboard.writeText(t).then(()=>msg('캡션을 복사했습니다.')).catch(()=>{$('#cap').select();msg('선택된 캡션을 Ctrl+C(⌘+C)로 복사하세요.')})};

/* ---------- 기타 입력 ---------- */
document.querySelectorAll('#series input').forEach(r=>r.onchange=()=>{st.series=r.value;if(r.value!=='climate'){st.ep='';$('#ep').value=''}editors();render()});
$('#photo').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{st.photo=im;$('#photoNote').hidden=false;render()};im.src=URL.createObjectURL(f)};
$('#rmPhoto').onclick=()=>{st.photo=null;$('#photo').value='';$('#photoNote').hidden=true;render()};
$('#src').oninput=e=>{st.source=e.target.value;later()};
$('#ep').oninput=e=>{st.ep=e.target.value.replace(/[^\d]/g,'');later()};
$('#blogo').checked=brand.logo;$('#blogo').onchange=e=>{brand.logo=e.target.checked;try{localStorage.setItem('cn-brand2',JSON.stringify(brand))}catch(er){}render()};
[['bname','name'],['bhandle','handle'],['bcolor','color']].forEach(([id,k])=>{const el=$('#'+id);el.value=brand[k];
  el.oninput=()=>{brand[k]=el.value;try{localStorage.setItem('cn-brand2',JSON.stringify(brand))}catch(e){}later()}});
$('#add').onclick=()=>{st.slides.splice(Math.max(0,st.slides.length-1),0,{kind:'point',title:'새 장',body:'',items:[]});editors();render()};
const step=d=>{const r=$('#rail'),f=r.querySelector('figure');r.scrollBy({left:d*((f?f.offsetWidth:300)+16),behavior:'smooth'})};
$('#prev').onclick=()=>step(-1);$('#next').onclick=()=>step(1);
$('#rail').onkeydown=e=>{if(e.key==='ArrowLeft'){e.preventDefault();step(-1)}if(e.key==='ArrowRight'){e.preventDefault();step(1)}};

editors();lowerPanel();
Promise.all([LOGO.dark,LOGO.light].map(l=>l.decode().catch(()=>{}))).then(render);
use('downloads').then(d=>{if(!d)return;dl=d;$('#zip').hidden=false;$('#dlhint').hidden=true;render()});
}
</script>
</body>
</html>
